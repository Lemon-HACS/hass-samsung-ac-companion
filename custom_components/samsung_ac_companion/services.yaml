probe_ocf:
  name: OCF 리소스 조회
  description: >-
    execute capability 로 삼성 OCF 기기의 리소스를 읽어본다. SmartThings 표준
    capability 로 노출되지 않는 기능(무풍/미풍/청정 등)의 제어 경로를 찾기 위한
    조사용 서비스다. `/oic/res` 로 리소스 목록부터 확인하는 것을 권장한다.
  fields:
    st_device_id:
      name: SmartThings 기기 ID
      description: SmartThings 의 deviceId (HA device_id 가 아님)
      required: true
      example: C0972770-32BB-0000-0000-000000000000
      selector:
        text:
    href:
      name: OCF 리소스 경로
      description: 읽어올 OCF 리소스 경로
      required: true
      example: /oic/res
      selector:
        text:
    component:
      name: 컴포넌트
      description: 명령을 보낼 컴포넌트. execute capability 를 가진 컴포넌트여야 한다
      required: false
      default: main
      example: main
      selector:
        text:
    wait:
      name: 대기 시간(초)
      description: >-
        execute 결과는 비동기로 채워지므로 명령 후 이만큼 기다렸다가 상태를
        다시 읽는다
      required: false
      default: 3
      selector:
        number:
          min: 0
          max: 30
          step: 0.5
          unit_of_measurement: 초
    include_raw:
      name: 전체 상태 포함
      description: 응답에 기기의 raw status 전체를 포함한다 (응답이 커진다)
      required: false
      default: false
      selector:
        boolean:

send_command:
  name: SmartThings 명령 전송
  description: >-
    임의의 SmartThings 명령을 검증 없이 전달한다. device profile 에 노출되지
    않은 capability(예: 무풍 execute 페이로드)를 시도할 때 쓴다.
    실패해도 예외 대신 오류 내용을 응답으로 돌려준다.
  fields:
    st_device_id:
      name: SmartThings 기기 ID
      description: SmartThings 의 deviceId (HA device_id 가 아님)
      required: true
      example: C0972770-32BB-0000-0000-000000000000
      selector:
        text:
    capability:
      name: Capability
      description: 예) execute, custom.airConditionerOptionalMode
      required: true
      example: execute
      selector:
        text:
    command:
      name: Command
      description: 예) execute, setAcOptionalMode
      required: true
      example: execute
      selector:
        text:
    component:
      name: 컴포넌트
      required: false
      default: main
      example: main
      selector:
        text:
    arguments:
      name: Arguments
      description: >-
        commands.arguments 로 그대로 전달되는 리스트.
        예) ["mode/vs/0", {"x.com.samsung.da.options": ["Comode_WindFree"]}]
      required: false
      selector:
        object:

api_get:
  name: SmartThings API GET
  description: >-
    코어 통합의 인증된 클라이언트로 SmartThings API 에 GET 요청을 보낸다.
    pysmartthings 가 래핑하지 않는 엔드포인트(device presentation 등) 조회용.
  fields:
    path:
      name: 경로
      description: https://api.smartthings.com/ 뒤에 붙는 경로
      required: true
      example: devices/C0972770-32BB-0000-0000-000000000000/presentation
      selector:
        text:
    params:
      name: 쿼리 파라미터
      required: false
      selector:
        object:

local_token:
  name: 로컬 API 토큰 발급
  description: >-
    삼성 에어컨의 로컬 API(포트 8888)에서 Bearer 토큰을 발급받는다.
    기기는 토큰을 응답이 아니라 콜백으로 보내므로, 이 서비스가 콜백 리스너를
    열고 기다린다. **서비스를 실행한 뒤 에어컨 전원을 껐다 켜야** 발급된다.
    403 이 나오면 이전 요청이 확인 대기 중이라는 뜻이므로, 전원을 물리적으로
    차단했다 복구해 초기화한 뒤 다시 시도한다.
  fields:
    host:
      name: 에어컨 IP
      required: true
      example: 192.168.0.31
      selector:
        text:
    port:
      name: 포트
      required: false
      default: 8888
      selector:
        number:
          min: 1
          max: 65535
          mode: box
    callback_host:
      name: 콜백 주소
      description: >-
        기기가 토큰을 보낼 주소. 비워두면 기기에 도달하는 HA 의 IP 를
        자동으로 알아낸다
      required: false
      example: 192.168.0.11
      selector:
        text:
    callback_port:
      name: 콜백 포트
      required: false
      default: 8889
      selector:
        number:
          min: 1
          max: 65535
          mode: box
    wait:
      name: 콜백 대기(초)
      description: 이 시간 안에 에어컨 전원을 껐다 켜야 한다
      required: false
      default: 90
      selector:
        number:
          min: 10
          max: 300
          unit_of_measurement: 초

local_request:
  name: 로컬 API 호출
  description: >-
    발급받은 토큰으로 에어컨 로컬 API 를 호출한다.
    예) GET /devices/0/operation
  fields:
    host:
      name: 에어컨 IP
      required: true
      example: 192.168.0.31
      selector:
        text:
    token:
      name: Bearer 토큰
      required: true
      selector:
        text:
    path:
      name: 경로
      required: true
      example: /devices/0/operation
      selector:
        text:
    port:
      name: 포트
      required: false
      default: 8888
      selector:
        number:
          min: 1
          max: 65535
          mode: box
    method:
      name: HTTP 메서드
      required: false
      default: GET
      selector:
        select:
          options: [GET, POST, PUT, PATCH, DELETE]
    body:
      name: 요청 바디
      description: JSON 문자열
      required: false
      example: '{"windFree": "on"}'
      selector:
        text:
          multiline: true
